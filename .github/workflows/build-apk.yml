name: Build Hello Sera APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "Using $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Restore exact Sera image and voice
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/raw
          cat > /tmp/sera_image.b64 <<'EOF_IMG'
          
          EOF_IMG
          base64 -d /tmp/sera_image.b64 > app/src/main/res/drawable/sera_character.jpg
          cat > /tmp/sera_voice.b64 <<'EOF_AUD'
          
          EOF_AUD
          base64 -d /tmp/sera_voice.b64 > app/src/main/res/raw/sera_good_morning.mp3
          echo "d92b6461993fa76f9d612c1898cf9a8b67621eb0a4abaf98b8953e02960bd105  app/src/main/res/drawable/sera_character.jpg" | sha256sum -c -
          file app/src/main/res/drawable/sera_character.jpg
          file app/src/main/res/raw/sera_good_morning.mp3
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hello-sera-v2-apk
          path: app/build/outputs/apk/debug/app-debug.apk
