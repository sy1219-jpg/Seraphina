name: Build Hello Sera APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "Using $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Restore exact Sera image and voice
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/raw
          cat > /tmp/sera_image.b64 <<'EOF_IMG'
          
          EOF_IMG
          base64 -d /tmp/sera_image.b64 > app/src/main/res/drawable/sera_character.jpg
          cat app/src/main/res/raw/voice_0730_0.b64 app/src/main/res/raw/voice_0730_1.b64 | base64 -d > app/src/main/res/raw/voice_0730.mp3
          cat app/src/main/res/raw/voice_1200_0.b64 app/src/main/res/raw/voice_1200_1.b64 | base64 -d > app/src/main/res/raw/voice_1200.mp3
          cat app/src/main/res/raw/voice_1900_0.b64 app/src/main/res/raw/voice_1900_1.b64 | base64 -d > app/src/main/res/raw/voice_1900.mp3
          cat app/src/main/res/raw/voice_0030_0.b64 app/src/main/res/raw/voice_0030_1a.b64 app/src/main/res/raw/voice_0030_1b.b64 app/src/main/res/raw/voice_0030_2.b64 app/src/main/res/raw/voice_0030_3.b64 | base64 -d > app/src/main/res/raw/voice_0030.mp3

          echo "f8f8209c2f03c461cfba53bd433947266f2f54eda05a03ba52c0280335aad962  app/src/main/res/raw/voice_0730.mp3" | sha256sum -c -
          echo "a1e6d4d2fea9923f69b82abd15cd6bd481e63031f3227d0c6f43671e12bd6ba4  app/src/main/res/raw/voice_1200.mp3" | sha256sum -c -
          echo "80655db7a72d40b2596bb304729640f206b7f96bce9389fdcb1f645de2ed10be  app/src/main/res/raw/voice_1900.mp3" | sha256sum -c -
          echo "9256157d61ee045a5f9930e2f33bf9929fc133149d794e6905589565cb23ef32  app/src/main/res/raw/voice_0030.mp3" | sha256sum -c -

          test "$(stat -c%s app/src/main/res/raw/voice_0730.mp3)" = "13964"
          test "$(stat -c%s app/src/main/res/raw/voice_1200.mp3)" = "10988"
          test "$(stat -c%s app/src/main/res/raw/voice_1900.mp3)" = "10604"
          test "$(stat -c%s app/src/main/res/raw/voice_0030.mp3)" = "18284"

          rm -f app/src/main/res/raw/voice_*.b64
          rm -f app/src/main/res/raw/sera_audio_part*.b64
          rm -f app/src/main/res/raw/sera_good_morning.mp3

          echo "d92b6461993fa76f9d612c1898cf9a8b67621eb0a4abaf98b8953e02960bd105  app/src/main/res/drawable/sera_character.jpg" | sha256sum -c -
          file app/src/main/res/drawable/sera_character.jpg
          file app/src/main/res/raw/voice_0730.mp3
          file app/src/main/res/raw/voice_1200.mp3
          file app/src/main/res/raw/voice_1900.mp3
          file app/src/main/res/raw/voice_0030.mp3
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hello-sera-v4-scheduled-apk
          path: app/build/outputs/apk/debug/app-debug.apk
